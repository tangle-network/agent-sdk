packages:
  - "packages/*"
linkWorkspacePackages: true
catalog:
  "@types/node": 26.6.5
  tsdown: 0.23.2
  typescript: 6.0.3
  undici: 8.12.3
  zod: ^4.6.6
  vitest: 5.0.5

# Packages whose public API contains AgentProfile must compile and test against
# this workspace's one canonical schema, even when an external dev dependency
# was published against an older exact agent-interface version.
overrides:
  "@tangle-network/agent-interface": workspace:*
  # Older published Tangle packages in the dev graph still pin zod 4.6.5
  # (GHSA-mrhx-c7xc-m3w5); hold every copy at the patched catalog version.
  zod: 4.6.7
# First-party releases skip the default minimum release age; this workspace
# tracks their newest versions as soon as they publish.
minimumReleaseAgeExclude:
  - "@tangle-network/*"
# protobufjs (via the Daytona SDK's OpenTelemetry exporters) runs a postinstall
# that only checks its optional CLI's dependencies; nothing here uses that CLI.
  - '@changesets/cli@3.0.3'
  - '@modelcontextprotocol/sdk@1.32.2'
  - '@noble/hashes@2.4.0'
  - '@types/node@26.6.5'
  - '@types/spdx-expression-parse@4.0.0'
  - 'semver@7.8.5'
  - 'spdx-expression-parse@5.0.0'
  - 'tsdown@0.23.2'
  - 'typescript@7.0.2'
  - 'undici@8.12.3'
  - 'vitest@5.0.5'
  - 'zod@4.6.7'
allowBuilds:
  protobufjs: false
