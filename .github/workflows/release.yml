name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      # Required for npm OIDC trusted publishing (tokenless) + provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # npm 12.0.0 provenance publishing fails with MODULE_NOT_FOUND for
      # sigstore. Pin the exact known-good release; OIDC trusted publishing
      # requires npm >= 11.5.1.
      - run: |
          npm install -g npm@11.18.0
          test "$(npm --version)" = "11.18.0"
      - run: pnpm -r build
      - run: pnpm check:package-artifacts
      - run: pnpm check:control-artifacts
      - id: changesets
        uses: changesets/action@v2.1.1
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
          create-github-releases: true
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - id: release-commit
        name: Resolve published release commit
        if: steps.changesets.outputs.published == 'true'
        shell: bash
        run: |
          release_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ || "$release_sha" != "$remote_sha" ]]; then
            echo "release checkout $release_sha is not the current pushed main commit $remote_sha" >&2
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      # The changesets action pushes with GITHUB_TOKEN, which does not start a
      # second push workflow. Dispatch the evidence workflow after the release
      # action so it checks the exact commit the action just versioned and tagged.
      - name: Dispatch upstream evidence
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -cn --arg ref "main" --arg release_sha "$RELEASE_SHA" \
            '{ref: $ref, inputs: {release_sha: $release_sha}}' |
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.github.com/repos/$REPOSITORY/actions/workflows/upstream-evidence.yml/dispatches" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data-binary @-
