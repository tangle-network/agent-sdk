name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      inspect_publish_auth:
        description: Inspect publish authentication without uploading a package
        type: boolean
        default: false

concurrency: release-${{ github.ref }}

jobs:
  plan:
    if: github.repository == 'tangle-network/agent-sdk' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on:
      group: public-app-production
      labels: [self-hosted, ci-deploy]
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the Changesets release plan and registry
        id: plan
        env:
          INSPECT_PUBLISH_AUTH: ${{ github.event_name == 'workflow_dispatch' && inputs.inspect_publish_auth }}
        run: |
          if [[ "$INSPECT_PUBLISH_AUTH" == true ]]; then
            echo 'version=false' >> "$GITHUB_OUTPUT"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm exec changeset status --output "$RUNNER_TEMP/changeset-status.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/changeset-status.json`, 'utf8'));
          const version = plan.changesets.length > 0;
          let publish = false;
          if (!version) {
            for (const dir of fs.readdirSync('packages', { withFileTypes: true })) {
              const path = `packages/${dir.name}/package.json`;
              if (!dir.isDirectory() || !fs.existsSync(path)) continue;
              const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (manifest.private) continue;
              const url = `https://registry.npmjs.org/${encodeURIComponent(manifest.name)}/${encodeURIComponent(manifest.version)}`;
              const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
              if (!response.ok && response.status !== 404) throw new Error(`Registry returned ${response.status} for ${manifest.name}`);
              if (response.status === 404) publish = true;
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\npublish=${publish}\n`);
          NODE

  version:
    needs: plan
    if: inputs.inspect_publish_auth != true && needs.plan.outputs.version == 'true' && github.repository == 'tangle-network/agent-sdk' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on:
      group: public-app-production
      labels: [self-hosted, ci-deploy]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2.1.2
        with:
          version-script: pnpm changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: plan
    if: needs.plan.outputs.publish == 'true' || (github.event_name == 'workflow_dispatch' && inputs.inspect_publish_auth == true && needs.plan.result == 'success')
    # npm trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      # Required for npm OIDC trusted publishing (tokenless) + provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # npm 12.0.0 failed provenance publishing with MODULE_NOT_FOUND for
      # sigstore; 12.1.0 loads it. Pin the exact release so an untested npm
      # cannot reach the publish step. OIDC trusted publishing needs >= 11.5.1.
      - run: |
          npm install -g npm@12.1.0
          test "$(npm --version)" = "12.1.0"
      - run: pnpm -r build
      - run: pnpm check:package-artifacts
      - run: pnpm check:control-artifacts
      - name: Inspect publish authentication without package upload
        if: inputs.inspect_publish_auth == true
        timeout-minutes: 3
        env:
          NPM_CONFIG_PROVENANCE: "true"
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          from urllib.parse import urlsplit

          if 'NPM_ID_TOKEN' in os.environ or os.environ.get('GITHUB_ACTIONS') != 'true':
              print(json.dumps({'authVerdict': 'REFUSED', 'code': 'UNEXPECTED_IDENTITY_CONTEXT'}))
              sys.exit(2)
          # Never retain raw stderr, environment values, URLs, response bodies or tokens.
          # This pinned pnpm performs OIDC before its dry-run return; scripts stay disabled.
          command = [
              'timeout', '--signal=TERM', '--kill-after=5s', '120s', 'pnpm',
              '--dir', 'packages/harness-sessions', 'publish', '--dry-run',
              '--ignore-scripts', '--reporter=ndjson',
          ]
          seen = {'github_id_token': None, 'npm_oidc_exchange': None, 'dry_run': False}
          warnings = []
          warning_stages = {
              'AUTH_TOKEN_FETCH': 'EXCHANGE_FETCH', 'AUTH_TOKEN_EXCHANGE': 'EXCHANGE',
              'AUTH_TOKEN_JSON_INTERRUPTED': 'EXCHANGE_MALFORMED', 'AUTH_TOKEN_MALFORMED_JSON': 'EXCHANGE_MALFORMED',
              'ID_TOKEN_REGISTRY_AUDIENCE_MISMATCH': 'AUDIENCE',
              'ID_TOKEN_GITHUB_WORKFLOW_INCORRECT_PERMISSIONS': 'PERMISSION',
              'ID_TOKEN_GITHUB_INVALID_RESPONSE': 'ID_TOKEN_FETCH',
              'ID_TOKEN_GITHUB_JSON_INTERRUPTED_ERROR': 'ID_TOKEN_MALFORMED',
              'ID_TOKEN_GITHUB_JSON_INVALID_VALUE': 'ID_TOKEN_MALFORMED',
          }
          process = subprocess.Popen(command, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True, errors='replace')
          for line in process.stderr:
              try:
                  record = json.loads(line)
              except (ValueError, TypeError):
                  continue
              if not isinstance(record, dict) or record.get('name') != 'pnpm:global':
                  continue
              message = record.get('message', '')
              if not isinstance(message, str):
                  continue
              http = re.fullmatch(r'GET (\S+) (\d{3}) \d+ms', message)
              if http:
                  try:
                      host = urlsplit(http.group(1)).hostname or ''
                  except ValueError:
                      host = ''
                  if host.endswith('.actions.githubusercontent.com'):
                      seen['github_id_token'] = int(http.group(2))
              if message.startswith('Skipped OIDC:') and len(warnings) < 16:
                  code = next((key for key in warning_stages if message.startswith('Skipped OIDC: ERR_PNPM_' + key + ':')), None)
                  status = re.search(r'\(status code (\d{3})\)$', message)
                  warnings.append({
                      'stage': warning_stages.get(code, 'OIDC_UNKNOWN'),
                      'code': 'ERR_PNPM_' + code if code else 'OIDC_SKIPPED',
                      'httpStatus': int(status.group(1)) if code == 'AUTH_TOKEN_EXCHANGE' and status else None,
                  })
              if re.fullmatch(r'Skip publishing @tangle-network/harness-sessions@[^ ]+ \(dry run\)', message):
                  seen['dry_run'] = True
          status = process.wait()
          # pnpm12.15.0 emits no positive token-exchange event. Do not infer one from
          # GET200, absence of warnings, a dry-run marker or a successful process exit.
          result = {
              'package': '@tangle-network/harness-sessions',
              'exitCode': status,
              'stages': seen,
              'warnings': warnings,
              'authVerdict': 'FAILED' if status or warnings else 'UNKNOWN',
              'reason': 'Positive npm token-exchange success is not observable in this CLI output',
              'packageUploadRequested': False,
          }
          print(json.dumps(result, sort_keys=True))
          sys.exit(1)  # Diagnostic mode fails closed; it can never promote a publish.
          PY
      - id: changesets
        if: inputs.inspect_publish_auth != true
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
          create-github-releases: true
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tokenless: every public package is registered on npmjs.com as a trusted
          # publisher for this workflow, so npm mints a short-lived OIDC credential
          # per publish. A NODE_AUTH_TOKEN here would take precedence over OIDC and
          # re-introduce the per-package token scope that blocked the provider
          # packages (2026-09-01: E404 on PUT for agent-provider-tangle/testkit).
          NPM_CONFIG_PROVENANCE: "true"
      - id: release-commit
        name: Resolve published release commit
        if: inputs.inspect_publish_auth != true && steps.changesets.outputs.published == 'true'
        shell: bash
        run: |
          release_sha="$(git rev-parse HEAD)"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release checkout did not resolve to a commit: $release_sha" >&2
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - id: release-ref
        name: Create immutable release ref
        if: inputs.inspect_publish_auth != true && steps.changesets.outputs.published == 'true'
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        run: |
          release_tag="agent-sdk-release-${RELEASE_SHA}"
          remote_sha="$(git ls-remote --refs origin "refs/tags/$release_tag" | cut -f1)"
          if [[ -n "$remote_sha" && "$remote_sha" != "$RELEASE_SHA" ]]; then
            echo "release tag $release_tag points to $remote_sha, expected $RELEASE_SHA" >&2
            exit 1
          fi
          if [[ -z "$remote_sha" ]]; then
            git tag "$release_tag" "$RELEASE_SHA"
            git push origin "refs/tags/$release_tag"
          fi
          echo "ref=$release_tag" >> "$GITHUB_OUTPUT"
      # The changesets action pushes with GITHUB_TOKEN, which does not start a
      # second push workflow. Dispatch the evidence workflow after the release
      # action so it checks the exact immutable ref the action just versioned.
      - name: Dispatch upstream evidence
        if: inputs.inspect_publish_auth != true && steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
          RELEASE_REF: ${{ steps.release-ref.outputs.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -cn --arg ref "$RELEASE_REF" --arg release_sha "$RELEASE_SHA" \
            '{ref: $ref, inputs: {release_sha: $release_sha}}' |
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.github.com/repos/$REPOSITORY/actions/workflows/upstream-evidence.yml/dispatches" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data-binary @-
