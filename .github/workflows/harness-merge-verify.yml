# One-shot verification; remove this workflow in the exact commit being tested.
name: Harness merged SDK verification
on:
  push:
    branches: ['refactor/harness-modularity-20261014']
    paths: ['.github/workflows/harness-merge-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g npm@12.1.0
      - name: Remove the temporary workflow without changing tested implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harness-merge-verify.yml
          git commit -m 'chore(harness): remove one-shot merge verification runner'
          git push origin HEAD:refs/heads/refactor/harness-modularity-20261014
      - name: Execute existing package and consumer checks
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const steps=[];
          for (const args of [['-r','build'],['-r','check-types'],['-r','test'],['check:package-artifacts'],['check:control-artifacts']]) {
            const result=spawnSync('pnpm',args,{encoding:'utf8',maxBuffer:64*1024*1024,timeout:480000,env:{...process.env,VITEST_MAX_WORKERS:'2'}});
            const name=args.join('-');
            writeFileSync(`${process.env.RUNNER_TEMP}/sdk-${name}.log`,`${result.stdout??''}\n${result.stderr??''}`);
            steps.push({command:['pnpm',...args],exitCode:result.status,signal:result.signal,error:result.error?.message});
          }
          const head=spawnSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).stdout.trim();
          writeFileSync(`${process.env.RUNNER_TEMP}/sdk-merge-proof.json`,JSON.stringify({head,steps},null,2));
          if(steps.some(step=>step.exitCode!==0)) process.exitCode=1;
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: harness-sdk-merged-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sdk-merge-proof.json
            ${{ runner.temp }}/sdk-*.log
          retention-days: 7
