# Braid upstream-evidence checks.
#
# Braid reads GitHub API metadata only. For each required UP-id it needs a
# check-run named exactly the UP-id, a run head_sha equal to the release tag
# commit, and an uploaded artifact whose name carries the UP-id with a sha256
# digest. The changesets "Version Packages" merge is a push to main whose commit
# is the tag commit, so this workflow triggers on that push. A tag push cannot
# trigger a workflow, so this workflow must not key on tags.
#
# Two operator decisions unblock the gated jobs. Both stay off until an operator
# sets the repository variable UPSTREAM_LIVE_EVIDENCE to "true".
#   1. Live cli-bridge (UP-05..08): stand up a bridge server that implements the
#      bridge wire protocol. Expose its address as the repository variable
#      CLI_BRIDGE_TEST_SERVER. The shipped cli-bridge tests mock the transport in
#      process, so the live check needs a packed cli-bridge cohort pointed at the
#      real server.
#   2. Live Tangle roundtrip (UP-09): provide the operator secrets
#      TANGLE_CI_SANDBOX_KEY, TANGLE_CI_SANDBOX_URL, and
#      TANGLE_CI_SANDBOX_SERVICE_ID. The public Sandbox client is chain-backed, so
#      the operator inputs map to a private key, an RPC url, and a service id.
#
# A skipped job never reports success, so Braid never counts it. Do not add these
# checks to branch protection; a skip must not block a merge.

name: Upstream Evidence

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  UP-01:
    name: UP-01
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node scripts/upstream-check.mjs UP-01
      - uses: actions/upload-artifact@v4
        with:
          name: UP-01-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  UP-02:
    name: UP-02
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
