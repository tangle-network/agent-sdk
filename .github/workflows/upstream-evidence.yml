# Braid upstream-evidence checks.
#
# Braid reads GitHub API metadata only. Each required UP-id needs a check-run
# with that exact name and a retained artifact from the package release ref.
# The release workflow creates an immutable ref for the package release commit,
# so the checks run only for that commit or an explicit dispatch from main.
#
# UP-05..08 use the checked-in CLI Bridge integration cohort. The cohort starts
# the real Bridge server and a bounded child that speaks its Pi JSONL protocol.
# It does not claim a live provider or use a mock Bridge HTTP server.
#
# UP-09 and UP-14 use the public Sandbox control plane with TANGLE_API_KEY and
# explicit staging URL and model variables. The dispatch input binds this live
# spend to one exact release commit.

name: Upstream Evidence

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact package release commit to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: upstream-evidence-${{ github.sha }}
  cancel-in-progress: true

jobs:
  release-commit:
    name: Detect release commit
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.release.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - id: release
        name: Validate release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [[ "$WORKFLOW_REF" == "refs/heads/main" ]]; then
            :
          elif [[ "$WORKFLOW_REF" =~ ^refs/tags/agent-sdk-release-[0-9a-f]{40}$ ]]; then
            tag_sha="${WORKFLOW_REF#refs/tags/agent-sdk-release-}"
            if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "release ref $WORKFLOW_REF does not encode release SHA $RELEASE_SHA" >&2
              exit 1
            fi
          else
            echo "upstream evidence must dispatch from main or an immutable release ref, received $WORKFLOW_REF" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "$RELEASE_SHA" != "$WORKFLOW_SHA" ]]; then
            echo "release_sha $RELEASE_SHA is not the workflow main SHA $WORKFLOW_SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$WORKFLOW_SHA" ]]; then
            echo "checked out $(git rev-parse HEAD), expected $WORKFLOW_SHA" >&2
            exit 1
          fi
          if ! git diff --unified=0 HEAD^ HEAD -- 'packages/*/package.json' \
            | grep -Eq '^\+  "version":'; then
            echo "release SHA does not change a publishable package version" >&2
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  control-contracts:
    name: ${{ matrix.check }}
    if: ${{ needs.release-commit.outputs.run == 'true' }}
    needs: release-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [UP-01, UP-02, UP-11, UP-12, UP-13]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node scripts/upstream-check.mjs ${{ matrix.check }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.check }}-evidence
          path: artifacts/${{ matrix.check }}-*.json
          if-no-files-found: error
          retention-days: 90

  cli-bridge:
    name: ${{ matrix.check }}
    if: ${{ needs.release-commit.outputs.run == 'true' }}
    needs: release-commit
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [UP-05, UP-06, UP-07, UP-08]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: cli-bridge-source
        name: Validate allowlisted CLI Bridge source
        shell: bash
        env:
          EXPECTED_REPOSITORY: drewstone/cli-bridge
          EXPECTED_COMMIT: e94e87ba55dcc5a57f07b0f3ca2540fa382350f3
        run: |
          repository="$(jq -er '.cliBridge.repository' scripts/upstream-sources.json)"
          commit="$(jq -er '.cliBridge.commit' scripts/upstream-sources.json)"
          if [[ "$repository" != "$EXPECTED_REPOSITORY" ]]; then
            echo "CLI Bridge repository is not allowlisted: $repository" >&2
            exit 1
          fi
          if [[ "$commit" != "$EXPECTED_COMMIT" || ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CLI Bridge commit is not the allowlisted immutable pin" >&2
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.cli-bridge-source.outputs.repository }}
          ref: ${{ steps.cli-bridge-source.outputs.commit }}
          path: cli-bridge
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            cli-bridge/pnpm-lock.yaml
      - name: Enable CLI Bridge filesystem jail
        shell: bash
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i \
              's#http://azure.archive.ubuntu.com/ubuntu/#https://archive.ubuntu.com/ubuntu/#g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout 120s apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 60s apt-get \
            install --yes --no-install-recommends bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --ro-bind / / -- true
      - run: pnpm install --frozen-lockfile
        working-directory: cli-bridge
      - run: pnpm rebuild better-sqlite3
        working-directory: cli-bridge
      - run: pnpm build
        working-directory: cli-bridge
      - run: pnpm install --frozen-lockfile
      - run: node scripts/upstream-check.mjs ${{ matrix.check }}
        env:
          CLI_BRIDGE_INTEGRATION_ROOT: ${{ github.workspace }}/cli-bridge
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.check }}-evidence
          path: artifacts/${{ matrix.check }}-*.json
          if-no-files-found: error
          retention-days: 90

  tangle:
    name: ${{ matrix.check }}
    if: ${{ needs.release-commit.outputs.run == 'true' }}
    needs: release-commit
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [UP-09, UP-14]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node scripts/upstream-check.mjs ${{ matrix.check }}
        env:
          TANGLE_API_KEY: ${{ secrets.TANGLE_API_KEY }}
          TANGLE_SANDBOX_URL: ${{ vars.TANGLE_SANDBOX_URL }}
          TANGLE_MODEL_PROVIDER: tangle-router
          TANGLE_MODEL: tangle-router/glm-5.3
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.check }}-evidence
          path: artifacts/${{ matrix.check }}-*.json
          if-no-files-found: error
          retention-days: 90
