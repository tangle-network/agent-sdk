# Braid upstream-evidence checks.
#
# Braid reads GitHub API metadata only. Each required UP-id needs a check-run
# with that exact name and a retained artifact from the package tag commit.
# The changesets release commit updates package versions and is that tag
# commit, so the checks run only for that commit or an explicit dispatch.
#
# UP-05..08 use the checked-in CLI Bridge integration cohort. The cohort starts
# the real Bridge server and a bounded child that speaks its Pi JSONL protocol.
# It does not claim a live provider or use a mock Bridge HTTP server.
#
# UP-09 and UP-14 use the public Sandbox control plane with TANGLE_API_KEY and
# explicit staging URL and model variables. The release detector and manual
# dispatch bound this live spend to release evidence.

name: Upstream Evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-commit:
    name: Detect release commit
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.release.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: release
        name: Detect package version changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --unified=0 HEAD^ HEAD -- 'packages/*/package.json' \
            | grep -Eq '^\+  "version":'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  control-contracts:
    name: ${{ matrix.check }}
    if: ${{ needs.release-commit.outputs.run == 'true' }}
    needs: release-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [UP-01, UP-02, UP-11, UP-12, UP-13]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node scripts/upstream-check.mjs ${{ matrix.check }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.check }}-evidence
          path: artifacts/${{ matrix.check }}-*.json
          if-no-files-found: error
          retention-days: 90

  cli-bridge:
    name: ${{ matrix.check }}
    if: ${{ needs.release-commit.outputs.run == 'true' }}
    needs: release-commit
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [UP-05, UP-06, UP-07, UP-08]
    steps:
      - uses: actions/checkout@v7
      - id: cli-bridge-source
        name: Read pinned CLI Bridge source
        shell: bash
        run: |
          echo "repository=$(jq -r '.cliBridge.repository' scripts/upstream-sources.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r '.cliBridge.commit' scripts/upstream-sources.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.cli-bridge-source.outputs.repository }}
          ref: ${{ steps.cli-bridge-source.outputs.commit }}
          path: cli-bridge
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            cli-bridge/pnpm-lock.yaml
      - name: Enable CLI Bridge filesystem jail
        shell: bash
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i \
              's#http://azure.archive.ubuntu.com/ubuntu/#https://archive.ubuntu.com/ubuntu/#g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout 120s apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 60s apt-get \
            install --yes --no-install-recommends bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --ro-bind / / -- true
      - run: pnpm install --frozen-lockfile
        working-directory: cli-bridge
      - run: pnpm rebuild better-sqlite3
        working-directory: cli-bridge
      - run: pnpm build
        working-directory: cli-bridge
      - run: pnpm install --frozen-lockfile
      - run: node scripts/upstream-check.mjs ${{ matrix.check }}
        env:
          CLI_BRIDGE_INTEGRATION_ROOT: ${{ github.workspace }}/cli-bridge
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.check }}-evidence
          path: artifacts/${{ matrix.check }}-*.json
          if-no-files-found: error
          retention-days: 90

  tangle:
    name: ${{ matrix.check }}
    if: ${{ needs.release-commit.outputs.run == 'true' }}
    needs: release-commit
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [UP-09, UP-14]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node scripts/upstream-check.mjs ${{ matrix.check }}
        env:
          TANGLE_API_KEY: ${{ secrets.TANGLE_API_KEY }}
          TANGLE_SANDBOX_URL: ${{ vars.TANGLE_SANDBOX_URL }}
          TANGLE_MODEL_PROVIDER: tangle-router
          TANGLE_MODEL: tangle-router/glm-5.3
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.check }}-evidence
          path: artifacts/${{ matrix.check }}-*.json
          if-no-files-found: error
          retention-days: 90
