# Braid upstream-evidence checks.
#
# Braid reads GitHub API metadata only. Each required UP-id needs a check-run
# with that exact name and a retained artifact from the package release ref.
# The release workflow creates an immutable ref for the package release commit,
# so the checks run only for that commit or an explicit dispatch from main.
#
# UP-05..08 use the checked-in CLI Bridge integration cohort. The cohort starts
# the real Bridge server and a bounded child that speaks its Pi JSONL protocol.
# It does not claim a live provider or use a mock Bridge HTTP server.
#
# UP-09 and UP-14 use the public Sandbox control plane with TANGLE_API_KEY and
# explicit staging URL and model variables. The dispatch input binds this live
# spend to one exact release commit.

name: Upstream Evidence

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact package release commit to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: upstream-evidence-${{ github.sha }}
  cancel-in-progress: true

jobs:
  evidence:
    # Immutable reviewed body; a same-name tag cannot replace this implementation.
    uses: tangle-network/agent-sdk/.github/workflows/upstream-trusted.yml@8fe41bb588016b91461dd7ac8eb891a3038050c3
    with:
      release_sha: ${{ inputs.release_sha }}
    secrets:
      TANGLE_API_KEY: ${{ secrets.TANGLE_API_KEY }}
