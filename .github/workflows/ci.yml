name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r check-types
      - run: pnpm -r test
      - run: pnpm check:package-artifacts
      - run: pnpm check:control-artifacts

  cli-bridge-integration:
    name: CLI Bridge integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: drewstone/cli-bridge
          ref: e94e87ba55dcc5a57f07b0f3ca2540fa382350f3
          path: cli-bridge
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            cli-bridge/pnpm-lock.yaml
      - name: Enable CLI Bridge filesystem jail
        shell: bash
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i \
              's#http://azure.archive.ubuntu.com/ubuntu/#https://archive.ubuntu.com/ubuntu/#g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout 120s apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 60s apt-get \
            install --yes --no-install-recommends bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --ro-bind / / -- true
      - run: pnpm install --frozen-lockfile
        working-directory: cli-bridge
      - run: pnpm rebuild better-sqlite3
        working-directory: cli-bridge
      - run: pnpm build
        working-directory: cli-bridge
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tangle-network/agent-provider-cli-bridge... build
      - run: pnpm --filter @tangle-network/agent-provider-cli-bridge test:integration
        env:
          CLI_BRIDGE_INTEGRATION_ROOT: ${{ github.workspace }}/cli-bridge
