name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: [self-hosted, ci-public]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Release runs the artifact checks with this exact npm. Run them with the
      # same npm here so a pull request cannot pass CI and then fail at release.
      # Install it under this job's temp directory: the self-hosted runners keep
      # their tool cache between jobs, so a global install would leak.
      - run: |
          npm install --prefix "$RUNNER_TEMP/npm" --no-save npm@12.1.0
          echo "$RUNNER_TEMP/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: test "$(npm --version)" = "12.1.0"
      - run: pnpm -r build
      - run: pnpm -r check-types
      - run: pnpm -r test
      - run: pnpm check:package-artifacts
      - run: pnpm check:control-artifacts

  cli-bridge-integration:
    name: CLI Bridge integration
    runs-on: [self-hosted, ci-public]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: cli-bridge-source
        name: Validate allowlisted CLI Bridge source
        shell: bash
        env:
          EXPECTED_REPOSITORY: drewstone/cli-bridge
          EXPECTED_COMMIT: e94e87ba55dcc5a57f07b0f3ca2540fa382350f3
        run: |
          repository="$(jq -er '.cliBridge.repository' scripts/upstream-sources.json)"
          commit="$(jq -er '.cliBridge.commit' scripts/upstream-sources.json)"
          if [[ "$repository" != "$EXPECTED_REPOSITORY" ]]; then
            echo "CLI Bridge repository is not allowlisted: $repository" >&2
            exit 1
          fi
          if [[ "$commit" != "$EXPECTED_COMMIT" || ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CLI Bridge commit is not the allowlisted immutable pin" >&2
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.cli-bridge-source.outputs.repository }}
          ref: ${{ steps.cli-bridge-source.outputs.commit }}
          path: cli-bridge
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            cli-bridge/pnpm-lock.yaml
      # The self-hosted runners provide bubblewrap and unprivileged user namespaces.
      - name: Check CLI Bridge filesystem jail
        shell: bash
        run: bwrap --unshare-user --ro-bind / / -- true
      - run: pnpm install --frozen-lockfile
        working-directory: cli-bridge
      - run: pnpm rebuild better-sqlite3
        working-directory: cli-bridge
      - run: pnpm build
        working-directory: cli-bridge
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tangle-network/agent-provider-cli-bridge... build
      - run: pnpm --filter @tangle-network/agent-provider-cli-bridge test:integration
        env:
          CLI_BRIDGE_INTEGRATION_ROOT: ${{ github.workspace }}/cli-bridge
