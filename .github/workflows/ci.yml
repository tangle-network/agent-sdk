name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r check-types
      - run: pnpm -r test
      - run: pnpm check:package-artifacts
      - run: pnpm check:control-artifacts

  cli-bridge-integration:
    name: CLI Bridge integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: drewstone/cli-bridge
          ref: fe57c8b4365aaec9abcb58f86941a3aa25c53196
          path: cli-bridge
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            cli-bridge/pnpm-lock.yaml
      - name: Enable CLI Bridge filesystem jail
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --ro-bind / / -- true
      - run: pnpm install --frozen-lockfile
        working-directory: cli-bridge
      - run: pnpm rebuild better-sqlite3
        working-directory: cli-bridge
      - run: pnpm build
        working-directory: cli-bridge
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tangle-network/agent-provider-cli-bridge... build
      - run: pnpm --filter @tangle-network/agent-provider-cli-bridge test:integration
        env:
          CLI_BRIDGE_INTEGRATION_ROOT: ${{ github.workspace }}/cli-bridge
