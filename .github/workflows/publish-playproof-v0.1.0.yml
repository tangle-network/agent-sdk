name: Publish Playproof 0.1.0

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-playproof-v0.1.0.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-playproof-v0.1.0.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: publish-playproof-v0.1.0-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  source-access-preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test organization-level user credential
        id: user-token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          login=$(gh api user --jq .login)
          role=$(gh api user/memberships/orgs/tangle-network --jq .role)
          repo=$(gh api repos/tangle-network/agent-lab --jq .full_name)
          admin=$(gh api repos/tangle-network/agent-lab --jq '.permissions.admin')
          package=$(gh api 'repos/tangle-network/agent-lab/contents/package.json?ref=a365cffdbdb1de63257af51912c0d37a8aab1805' --jq .content | base64 --decode)
          test "$repo" = tangle-network/agent-lab
          test "$(printf '%s' "$package" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name")" = '@tangle-network/playproof'
          test "$(printf '%s' "$package" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")" = '0.1.0'
          can_create=$(gh api orgs/tangle-network --jq 'if .members_can_create_public_repositories == null then .members_can_create_repositories else .members_can_create_public_repositories end')
          if [ "$role" != admin ] && [ "$can_create" != true ]; then
            echo "credential can read source but cannot create public organization repositories"
            exit 1
          fi
          echo "login=$login" >> "$GITHUB_OUTPUT"
          echo "role=$role" >> "$GITHUB_OUTPUT"
          echo "agent_lab_admin=$admin" >> "$GITHUB_OUTPUT"
          echo "can_create_public=$can_create" >> "$GITHUB_OUTPUT"

      - name: Test organization GitHub App credential
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.WEBB_SPIDER_APP_ID }}
          private-key: ${{ secrets.WEBB_SPIDER_PRIV_KEY }}
          owner: tangle-network

      - name: Inspect organization App repository access
        id: app-access
        if: steps.app-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          count=$(gh api /installation/repositories --jq .total_count)
          source_visible=false
          if gh api repos/tangle-network/agent-lab --jq .full_name >/dev/null 2>&1; then
            source_visible=true
          fi
          echo "repository_count=$count" >> "$GITHUB_OUTPUT"
          echo "source_visible=$source_visible" >> "$GITHUB_OUTPUT"

      - name: Report credential preflight on this PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/playproof-preflight.md <<'EOF'
          <!-- playproof-release-credential-preflight -->
          ## Playproof release credential preflight

          | Capability | Outcome |
          |---|---|
          | organization user credential | `${{ steps.user-token.outcome }}` |
          | user login | `${{ steps.user-token.outputs.login || 'unavailable' }}` |
          | organization role | `${{ steps.user-token.outputs.role || 'unavailable' }}` |
          | agent-lab admin | `${{ steps.user-token.outputs.agent_lab_admin || 'unavailable' }}` |
          | may create public org repos | `${{ steps.user-token.outputs.can_create_public || 'unavailable' }}` |
          | organization App token | `${{ steps.app-token.outcome }}` |
          | App-visible repositories | `${{ steps.app-access.outputs.repository_count || 'unavailable' }}` |
          | App can read agent-lab | `${{ steps.app-access.outputs.source_visible || 'unavailable' }}` |

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/playproof-preflight.md

      - name: Require at least one viable relevant-repository release path
        if: always()
        run: |
          if [ '${{ steps.user-token.outcome }}' != success ]; then
            echo '::error::agent-sdk has no verified organization credential that can read agent-lab and create the public repository'
            exit 1
          fi

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYPROOF_PYTHON: python
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - name: Check out immutable Playproof release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangle-network/playproof
          ref: v0.1.0
          path: playproof
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: playproof/pnpm-lock.yaml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Use known-good npm with provenance support
        run: |
          npm install --global npm@11.18.0
          test "$(npm --version)" = 11.18.0

      - name: Verify exact release tree
        working-directory: playproof
        run: |
          test "$(git describe --tags --exact-match)" = v0.1.0
          test "$(node -p "require('./package.json').name")" = '@tangle-network/playproof'
          test "$(node -p "require('./package.json').version")" = '0.1.0'
          pnpm install --frozen-lockfile
          python -m compileall -q desktop native pyboy
          pnpm ci

      - name: Build exact package archive
        id: package
        working-directory: playproof
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/playproof-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/playproof-package"
          mapfile -t packages < <(find "$RUNNER_TEMP/playproof-package" -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          sha256=$(sha256sum "$package" | cut -d' ' -f1)
          echo "path=$package" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "$sha256  $(basename "$package")" > "$RUNNER_TEMP/playproof-package/SHA256SUMS"

      - name: Publish exact archive if absent
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          if npm view '@tangle-network/playproof@0.1.0' version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo '@tangle-network/playproof@0.1.0 already exists; verifying only'
          else
            test -n "$NODE_AUTH_TOKEN"
            npm publish "$PACKAGE" --access public --provenance --registry=https://registry.npmjs.org
          fi

      - name: Verify registry identity and clean consumer
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if version=$(npm view '@tangle-network/playproof@0.1.0' version --registry=https://registry.npmjs.org 2>/dev/null); then
              test "$version" = 0.1.0
              break
            fi
            sleep 5
          done
          test "$(npm view '@tangle-network/playproof@0.1.0' version --registry=https://registry.npmjs.org)" = 0.1.0
          mkdir "$RUNNER_TEMP/playproof-consumer"
          cd "$RUNNER_TEMP/playproof-consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts '@tangle-network/playproof@0.1.0'
          node --input-type=module <<'NODE'
          const paths = [
            '@tangle-network/playproof',
            '@tangle-network/playproof/drivers',
            '@tangle-network/playproof/drivers/cli',
            '@tangle-network/playproof/drivers/openai-compatible',
            '@tangle-network/playproof/adapters/worker-rpc',
            '@tangle-network/playproof/adapters/native-2048',
            '@tangle-network/playproof/adapters/native-desktop',
            '@tangle-network/playproof/adapters/pyboy-rpc',
            '@tangle-network/playproof/adapters/pyboy-generic',
            '@tangle-network/playproof/adapters/pyboy-tetris',
            '@tangle-network/playproof/platforms/steam',
            '@tangle-network/playproof/platforms/xbox',
          ]
          for (const path of paths) await import(path)
          console.log(`clean consumer imported ${paths.length} public entrypoints`)
          NODE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playproof-v0.1.0-package
          path: ${{ runner.temp }}/playproof-package/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish inspectable release receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          gh issue create --repo tangle-network/agent-sdk \
            --title "Playproof npm publication ${JOB_STATUS}: run ${RUN_ID}.${RUN_ATTEMPT}" \
            --body "Publication status: **${JOB_STATUS}**\n\nRun: https://github.com/tangle-network/agent-sdk/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}\n\nCommit: ${GITHUB_SHA}\n\nThis receipt is emitted even when an earlier step fails."
